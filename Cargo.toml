[workspace]
members = [
    "src/api",
    "src/bin",
    "src/chaos",
    "src/checker",
    "src/client",
    "src/engine",
    "src/macro",
    "src/parser",
    "src/rock",
    "src/runtime",
    "src/schema",
    "src/server",

    # tools
    "tools/machine-bench",

    # layers
    "layers/etcd",

    # third
    "third/raft-engine",
    "third/raft-rs",
    "third/raft-rs/proto",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://sekas.w41ter.github.io"
repository = "https://github.com/w41ter/sekas"

[workspace.dependencies]
async-stream = "0.3"
bytes = "1"
crc32fast = "1.3"
futures = "0.3"
fastrace = { version = "0.7", features = ["enable"] }
lazy_static = "1.4"
libc = "0.2"
log = "0.4"
paste = "1.0"
prometheus = "0.14"
prometheus-static-metric = "0.5"
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rustyline = { version = "18.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = "0.14"
tonic-prost = "0.14"
thiserror = "2.0"
toml = "1.1"
tokio = { version = "1.21", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"

# for build
prost-build = "0.14"
tonic-prost-build = "0.14"
protoc-build = { git = "https://github.com/w41ter/protoc-build.git", rev = "v3.21.5" }
