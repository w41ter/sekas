profile = "smoke"
runner_threads = 2

[environment]
root_dir = "/tmp/sekas-perf-lab-smoke"
cleanup = true
disk_pools = []

[cluster]
nodes = 3
cpus_per_node = 1
enable_proxy_service = false

[cluster.root]
enable_group_balance = true
enable_replica_balance = true
enable_leader_balance = false
enable_shard_balance = true
enable_auto_shard_split = false
enable_auto_shard_merge = false
heartbeat_timeout_sec = 1
liveness_threshold_sec = 3
max_create_group_retry_before_rollback = 10
replicas_per_group = 3
schedule_interval_sec = 1
mvcc_gc_retention_ms = 1

[cluster.raft]
election_tick = 3
enable_log_recycle = false
max_inflight_msgs = 10000
max_inflight_requests = 102400
max_io_batch_size = 65535
max_size_per_msg = 67108864
tick_interval_ms = 100

[cluster.node]
shard_chunk_size = 67108864
shard_gc_keys = 256
mvcc_gc_keys = 256
mvcc_gc_interval_ms = 100
mvcc_gc_retention_ms = 1

[cluster.node.replica]
snap_file_size = 68719476736

[cluster.node.engine]
engine_slow_io_threshold_ms = 1000

[cluster.db]
block_cache_size = 65536
write_buffer_size = 16384
max_write_buffer_number = 3
max_background_jobs = 2
max_sub_compactions = 1
mvcc_gc_retention_ms = 1

[execution]
database = "perf_lab_smoke"
duration_secs = 1
warmup_secs = 0
cooldown_secs = 1
request_timeout_secs = 10
event_timeout_secs = 40
storage_duration_secs = 12
gc_retention_ms = 1000
gc_interval_ms = 100

[report]
out_dir = "target/perf-lab-smoke"
fail_on_regression = false

[log]
enabled = true
dir = "log"
filter = "warn"
