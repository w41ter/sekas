addrs = ["127.0.0.1:21805"]
database = "db"
table = "benchmark"
workers = 4
operations = 10000

# Client timeout for a transaction or read, in milliseconds.
# request_timeout_ms = 500

# Optional settings for the client runtime and repeatable operation selection.
# threads = 4
# report_interval_secs = 10
# seed = 7

[workload]
records = 1000
value_size = 10
distribution = "zipfian" # or "uniform"
zipfian_theta = 0.99
txn_keys = 4
scan_length = 20
# insert_start = 1000 # defaults to records

# Relative weights. Omitted operations in this section have zero weight.
[workload.mix]
read = 50
insert = 10
update = 30
scan = 10
