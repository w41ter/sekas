# Atomic increments on shared counters with Zipfian access.
addrs = ["127.0.0.1:21805"]
database = "db"
table = "bench_atomic_increment"
threads = 4
workers = 8
operations = 100_000
seed = 7

[workload]
records = 0
distribution = "zipfian"
zipfian_theta = 0.99
shared_keys = 4_096

[workload.mix]
increment = 100
